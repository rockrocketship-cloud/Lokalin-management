<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bd2922"><title>Lokalin Management</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#512720}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#a8201e,#dc3028 55%,#a71f1e);padding:20px;display:grid;place-items:center}.wrap{width:min(100%,780px)}header{text-align:center;color:#fff8eb;padding:25px 10px}.logo{display:inline-grid;place-items:center;width:120px;height:120px;border-radius:28px;background:#a80018;color:#fff4da;font-size:35px;font-style:italic;font-weight:900;letter-spacing:-2px}h1{font-size:32px;margin:20px 0 8px}header p{color:#ffe3d9}.panel{background:#fff8ed;border-radius:24px;padding:26px;margin:18px auto;max-width:480px;box-shadow:0 10px 30px #580c0c44}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #ddc9bc;border-radius:12px;font:inherit;font-size:16px}button,.card{border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;cursor:pointer}button{background:#a52a23;color:white;width:100%;margin-top:18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{display:flex;flex-direction:column;gap:12px;text-decoration:none;background:#fff8ed;color:#512720;min-height:160px;font-size:22px;box-shadow:0 8px 22px #65110d22}.card span{font-size:14px;font-weight:400}.hidden{display:none!important}.error{color:#a32921;white-space:pre-wrap}.who{color:#fff8ed;text-align:center}#logout{max-width:220px;display:block;margin:16px auto;background:#fff8ed;color:#8b2720}@media(max-width:500px){.cards{grid-template-columns:1fr}.card{min-height:125px}}
</style></head><body><main class="wrap"><header><div class="logo">lokalin</div><h1>Lokalin Management</h1><p>Absensi & Stok Bar / Kitchen</p></header><section id="loginPanel" class="panel hidden"><h2>Login Management</h2><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" id="loginButton">Masuk</button></form><p class="error" id="error" role="alert"></p></section><section id="dashboard" class="hidden"><p class="who" id="who"></p><nav class="cards"><a class="card" href="./absensi.html">📅 <b>Absensi Karyawan</b><span>Absen masuk, pulang, dan laporan</span></a><a class="card" href="./stok.html">📦 <b>Stok Bar & Kitchen</b><span>Stok barang, transaksi, dan laporan</span></a></nav><button id="logout">Logout</button></section><p class="who" id="loading">Memeriksa sesi login…</p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://kwhtqqrzeifmntdtugvg.supabase.co','sb_publishable_JGQ9jpXgEb3IMl0YjY3Txg_cQKy02Fs');
const $=id=>document.getElementById(id);
async function show(){const {data:{user},error}=await db.auth.getUser();$('loading').classList.add('hidden');$('loginPanel').classList.toggle('hidden',!!user&&!error);$('dashboard').classList.toggle('hidden',!user||!!error);$('who').textContent=user?.email||'';}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('loginButton').disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await show()}catch(err){$('error').textContent=err.message}finally{$('loginButton').disabled=false}};
$('logout').onclick=async()=>{await db.auth.signOut();await show()};await show();
</script></body></html>
