<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd2421"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lokalin"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><title>Lokalin Management</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;background:linear-gradient(155deg,#a91f1e,#d92d27 55%,#ac201c)}main{max-width:760px;margin:auto;padding:clamp(22px,6vw,46px) 20px 70px}.hero{padding:22px 18px 32px;border:1px solid #ffffff55;border-radius:28px;text-align:center;background:#ffffff0c}.hero img{width:min(70%,340px);height:auto;max-height:180px;object-fit:contain}h1{font-size:clamp(25px,5vw,38px);margin:16px 0 5px}.subtitle{opacity:.9;margin:0;font-size:15px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:22px;min-height:185px;background:#fffaf2;color:#4a211c;padding:22px;border-radius:24px;text-decoration:none;box-shadow:0 10px 25px #5b080821}.tile:focus-visible{outline:3px solid white}.symbol{font-size:36px}.name{font-size:21px;font-weight:750}.desc{font-size:13px;color:#775d57;margin-top:7px;line-height:1.45}.hint{margin:22px 4px;font-size:13px;line-height:1.6;color:#fff4ef}@media(max-width:390px){.menu{grid-template-columns:1fr}.tile{min-height:140px}}  .workspace{margin-top:22px;background:#fffaf2;color:#44241e;border-radius:22px;overflow:hidden;display:none}.workspace.on{display:block}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;font-weight:700}.workspace-head a{color:#a3211e;font-size:13px}.workspace iframe{display:block;width:100%;height:85vh;min-height:650px;border:0;background:white}.tile.active{outline:4px solid #ffddae}.tile{cursor:pointer;border:0;text-align:left;font:inherit} .workspace-note{font-size:12px;padding:0 16px 12px;color:#755b55} </style></head><body><main><header class="hero"><img src="./icon-512.png" alt="Logo Lokalin Cafe"><h1>Lokalin Management</h1><p class="subtitle">Satu tempat untuk operasional Lokalin Cafe</p></header><nav class="menu" aria-label="Pilih aplikasi"><button class="tile" type="button" data-app="absensi"><div class="symbol">📅</div><div><div class="name">Absensi Karyawan</div><div class="desc">Absen masuk, pulang, dan jadwal shift</div></div></button><button class="tile" type="button" data-app="stok"><div class="symbol">📦</div><div><div class="name">Stok Bar &amp; Kitchen</div><div class="desc">Barang, harga beli, stok masuk dan keluar</div></div></button></nav><section class="workspace" id="workspace"><div class="workspace-head"><span id="workspace-title">Aplikasi</span><a id="open-direct" href="#" target="_blank" rel="noopener">Buka langsung ↗</a></div><iframe id="app-frame" title="Lokalin app" loading="lazy"></iframe></section></main><script>const apps={absensi:{title:"Absensi Karyawan",url:"https://rockrocketship-cloud.github.io/absensi/"},stok:{title:"Stok Bar & Kitchen",url:"https://rockrocketship-cloud.github.io/Stok-barang/"}};document.querySelectorAll("[data-app]").forEach(btn=>btn.addEventListener("click",()=>{let app=apps[btn.dataset.app];document.querySelectorAll("[data-app]").forEach(b=>b.classList.toggle("active",b===btn));document.getElementById("workspace").classList.add("on");document.getElementById("workspace-title").textContent=app.title;document.getElementById("open-direct").href=app.url;document.getElementById("app-frame").src=app.url;document.getElementById("workspace").scrollIntoView({behavior:"smooth",block:"start"});}));</script></body></html>
