<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd2922"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><title>Ketersediaan Menu | Lokalin</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#512720;background:#f6efe8}*{box-sizing:border-box}body{margin:0;background:#f6efe8;color:#512720}button,input,select{font:inherit}a{color:inherit}.wrap{width:min(100%,880px);margin:auto;padding:0 16px}.hero{background:linear-gradient(150deg,#a8201e,#dc3028 55%,#a71f1e);color:#fff8eb;padding:calc(14px + env(safe-area-inset-top)) 0 32px;border-radius:0 0 28px 28px}.hero nav{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}.hero nav a{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;color:#fff8eb;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap;border-radius:999px}.hero nav a.back{background:#fff8ed;color:#8b2720}.hero nav a[aria-current="page"]{box-shadow:inset 0 0 0 1px #fff8eb}.kicker{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#ffe3d9}h1{margin:0 0 6px;font-size:clamp(28px,7vw,34px);letter-spacing:-.4px}.lede{margin:0;color:#ffe3d9}main{width:min(100%,880px);margin:-18px auto 0;padding:0 16px calc(36px + env(safe-area-inset-bottom))}
.panel{background:#fffdfb;border:1px solid #eadfd5;border-radius:22px;padding:16px;margin:0 0 12px;box-shadow:0 8px 22px #5127200e}#login.panel{background:#fff8ed;border:0;max-width:440px;margin:8px auto 12px;padding:22px}#login button[type="submit"]{width:100%}h2{margin:0 0 8px;font-size:18px}p{margin:0 0 10px;line-height:1.5;color:#7d5c52}label{display:block;margin:0 0 6px;font-size:13px;font-weight:800;color:#512720}input,select{width:100%;min-width:0;min-height:48px;padding:12px 14px;border:1px solid #ddc9bc;border-radius:12px;background:#fff;color:#512720;font-size:16px}input:focus,select:focus{outline:none;border-color:#b82521;box-shadow:0 0 0 3px #b8252133}button{border:0;border-radius:14px;background:#a52a23;color:#fff;min-height:48px;padding:12px 14px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.secondary{background:#fff8ed;color:#8b2720;box-shadow:inset 0 0 0 1px #e4d0c4}.hidden{display:none!important}
.notice{padding:14px;border-radius:14px;background:#fff6ef;border:1px solid #f0e2d6;color:#7d5c52;margin:0 0 12px}.notice.error{background:#fdeceb;border-color:#f3cfcb;color:#9d2420}.who-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 12px}.who-row span{font-size:13px;font-weight:800;color:#8b3a30}.who-row button{min-height:40px;width:auto}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}.tab{border:1px solid #eadfd5;border-radius:14px;background:#fff;color:#6d4037;min-height:48px}.tab.active{background:#a52a23;color:#fff8ed;border-color:#a52a23}.toolbar{display:grid;gap:8px;margin:0 0 12px}.summary{font-size:14px;color:#7d5c52;margin:0 0 8px}
.group{margin:14px 0;background:#fffdfb;border:1px solid #eadfd5;border-radius:18px;overflow:hidden}.group h2{margin:0;padding:14px;background:#fff8ed;font-size:16px}.item{padding:14px;border-top:1px solid #f1e6dd;display:grid;gap:10px}.item strong{display:block;font-size:16px}.item small{color:#7d5c52}.badges{display:flex;gap:6px;flex-wrap:wrap}.pill{border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#ece7e3;color:#5c4a44}.pill.ok{background:#d8f4df;color:#176b35}.pill.low{background:#fff0bd;color:#775000}.pill.out{background:#fdeceb;color:#9d2420}.pill.manual{background:#fff1e8;color:#8b3a30}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions .qty{width:120px;text-align:center}.switch{border-radius:999px;min-width:120px;background:#dcefe1;color:#156538}.switch.sold{background:#fce0db;color:#9b2b22}.links{background:#fff8ed;border-radius:14px;padding:12px}.links ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}.links li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px}.links li button{min-height:40px;width:auto;padding:8px 10px}.link-add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.empty{text-align:center;padding:22px 12px;border:1.5px dashed #e0cfc3;border-radius:16px;color:#7d5c52;background:#fffaf6}
@media(min-width:720px){.toolbar{grid-template-columns:1fr 220px}.panel{padding:20px}.link-add{grid-template-columns:1fr auto}}
</style></head><body>
<header class="hero"><div class="wrap"><nav aria-label="Navigasi Lokalin"><a class="back" href="./index.html">← Dashboard</a><a href="./stok.html">Stok</a><a href="./ketersediaan-menu.html" aria-current="page">Menu</a></nav><p class="kicker">Lokalin Cafe</p><h1>Ketersediaan Menu</h1><p class="lede">Makanan: porsi dan status · Minuman: Ready / Non Ready</p></div></header>
<main>
<p id="notice" class="notice">Memuat menu…</p>
<section id="login" class="panel hidden"><h2>Masuk untuk mengubah menu</h2><p>Melihat menu tidak perlu login. Mengubah status membutuhkan akun owner atau staf.</p><form id="loginForm"><div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div style="margin-top:12px"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="actions" style="margin-top:12px"><button type="submit">Masuk</button></div></form><p id="loginError" class="notice error hidden" role="alert"></p></section>
<div id="controls" class="hidden">
<div class="who-row"><span id="who"></span><button type="button" id="logout" class="secondary hidden">Keluar</button></div>
<div class="tabs"><button class="tab active" type="button" data-type="food">Makanan</button><button class="tab" type="button" data-type="drink">Minuman</button></div>
<div class="toolbar"><input id="search" type="search" placeholder="Cari nama menu…" aria-label="Cari menu"><select id="filter" aria-label="Filter status"><option value="all">Semua status</option><option value="ready">Siap dijual</option><option value="sold">Tidak siap</option><option value="low">Menipis</option></select></div>
<p class="summary" id="summary"></p>
<div id="list"></div>
</div>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://kwhtqqrzeifmntdtugvg.supabase.co','sb_publishable_JGQ9jpXgEb3IMl0YjY3Txg_cQKy02Fs');
const $=id=>document.getElementById(id);
const drinkCategories=new Set(['Coffee Classic','Coffee & Mocktail','Tea','Non-Coffee']);
const isDrink=x=>drinkCategories.has(x.category);
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=[],links=[],stockItems=[],user=null,canWrite=false,syncReady=false,currentType='food',quiet=false;
function note(message,isError=false){const el=$('notice');el.textContent=message;el.classList.toggle('error',isError);el.classList.remove('hidden')}
function hideNote(){$('notice').classList.add('hidden')}
function missingSchema(error){const m=`${error?.code||''} ${error?.message||''} ${error?.details||''}`;return /42P01|42703|PGRST204|PGRST205|schema cache|does not exist|Could not find/i.test(m)}
function stockById(id){return stockItems.find(s=>String(s.id)===String(id))}
function itemLinks(id){return links.filter(l=>String(l.menu_id)===String(id))}
function levelLabel(level){return level==='out'?'Habis':level==='low'?'Menipis':'Mengikuti stok'}
function render(){
  const q=$('search').value.toLocaleLowerCase('id').trim(),f=$('filter').value;
  const scoped=data.filter(x=>currentType==='drink'?isDrink(x):!isDrink(x));
  const filtered=scoped.filter(x=>{
    if(!x.name.toLocaleLowerCase('id').includes(q))return false;
    if(f==='all')return true;
    if(f==='low')return x.sync_level==='low';
    if(f==='ready')return !!x.is_ready;
    return !x.is_ready;
  });
  const low=scoped.filter(x=>x.sync_level==='low').length,out=scoped.filter(x=>x.sync_level==='out').length;
  $('summary').textContent=`${scoped.filter(x=>x.is_ready).length} siap · ${scoped.filter(x=>!x.is_ready).length} tidak siap · ${scoped.length} menu`+(currentType==='food'?' · '+scoped.reduce((a,x)=>a+Number(x.stock_qty||0),0)+' porsi':'')+(syncReady?` · ${low} menipis · ${out} habis karena stok`:'');
  const root=$('list');root.replaceChildren();
  const groups=[...new Set(filtered.map(x=>x.category))];
  for(const category of groups){
    const section=document.createElement('section');section.className='group';
    const title=document.createElement('h2');title.textContent=category;section.append(title);
    for(const item of filtered.filter(x=>x.category===category))section.append(renderItem(item));
    root.append(section);
  }
  if(!filtered.length){const p=document.createElement('p');p.className='empty';p.textContent='Tidak ada menu yang cocok.';root.append(p)}
}
function renderItem(item){
  const row=document.createElement('article');row.className='item';
  const head=document.createElement('div');
  const name=document.createElement('strong');name.textContent=item.name;
  const price=document.createElement('small');price.textContent=money(item.price);
  head.append(name,price);
  const badges=document.createElement('div');badges.className='badges';
  const linked=itemLinks(item.id);
  if(syncReady&&linked.length){
    const pill=document.createElement('span');
    pill.className='pill '+(item.availability_mode==='manual'?'manual':(item.sync_level||'ok'));
    pill.textContent=item.availability_mode==='manual'?'Manual':levelLabel(item.sync_level);
    badges.append(pill);
  }
  const actions=document.createElement('div');actions.className='actions';
  if(!isDrink(item)){
    const qty=document.createElement('input');qty.className='qty';qty.type='number';qty.min='0';qty.step='1';qty.inputMode='numeric';qty.value=String(item.stock_qty??0);qty.disabled=!canWrite;qty.setAttribute('aria-label',`Porsi ${item.name}`);
    const cap=document.createElement('span');cap.textContent='Porsi';cap.style.fontSize='13px';cap.style.fontWeight='800';
    qty.onchange=async()=>{
      const n=Number(qty.value);
      if(!Number.isSafeInteger(n)||n<0){note('Jumlah porsi harus bilangan bulat 0 atau lebih.',true);qty.value=String(item.stock_qty??0);return}
      qty.disabled=true;
      const patch={stock_qty:n};
      if(!syncReady||item.availability_mode!=='auto')patch.is_ready=n>0;
      const {error}=await db.from('menu_availability').update(patch).eq('id',item.id);
      qty.disabled=false;
      if(error){note('Gagal menyimpan porsi: '+error.message,true);qty.value=String(item.stock_qty??0);return}
      quiet=true;await load();
    };
    actions.append(cap,qty);
  }
  const auto=syncReady&&item.availability_mode==='auto'&&linked.length;
  const btn=document.createElement('button');btn.type='button';btn.className='switch'+(item.is_ready?'':' sold');
  btn.textContent=auto?(item.sync_level==='out'?'Habis · ikut stok':item.sync_level==='low'?'Menipis · tetap siap':'Siap · ikut stok'):(item.is_ready?'Siap':(isDrink(item)?'Non Ready':'Sold Out'));
  btn.disabled=!canWrite||auto;
  btn.setAttribute('aria-label',`Ubah status ${item.name}`);
  btn.onclick=async()=>{
    const next=!item.is_ready;
    if(!isDrink(item)&&next&&Number(item.stock_qty)===0&&(!syncReady||item.availability_mode!=='auto')){note('Isi jumlah porsi lebih dari 0 untuk mengaktifkan Siap.',true);return}
    btn.disabled=true;
    const patch={is_ready:next};
    if(syncReady)patch.availability_mode='manual';
    const {error}=await db.from('menu_availability').update(patch).eq('id',item.id);
    if(error){note(missingSchema(error)?'Kolom mode belum ada. Jalankan sql/menu-stock-sync.sql di Supabase.':'Gagal menyimpan: '+error.message,true);btn.disabled=false;return}
    quiet=true;await load();
  };
  actions.append(btn);
  row.append(head,badges,actions);
  if(canWrite&&syncReady)row.append(linkEditor(item,linked));
  else if(syncReady&&linked.length)row.append(linkReadout(linked));
  return row;
}
function linkReadout(linked){
  const box=document.createElement('div');box.className='links';
  const title=document.createElement('strong');title.textContent='Bahan stok';box.append(title);
  const ul=document.createElement('ul');
  for(const link of linked){
    const item=stockById(link.stock_item_id);
    const li=document.createElement('li');
    const per=link.qty_per_serving==null?'':` · ${Number(link.qty_per_serving).toLocaleString('id-ID')} / porsi`;
    li.textContent=item?`${item.name} · ${item.division} · ${Number(item.quantity||0).toLocaleString('id-ID')} ${item.unit}${per}`:'Bahan tersimpan';
    ul.append(li);
  }
  box.append(ul);return box;
}
function linkEditor(item,linked){
  const box=document.createElement('div');box.className='links';
  const title=document.createElement('strong');title.textContent='Bahan dari stok gudang';
  const hint=document.createElement('p');hint.textContent='Menu tidak siap jika salah satu bahan habis. Di bawah minimum, menu tetap siap tetapi ditandai menipis.';
  box.append(title,hint);
  if(!stockItems.length){const p=document.createElement('p');p.textContent='Daftar barang stok belum bisa dibaca dengan akun ini.';box.append(p);return box}
  const ul=document.createElement('ul');
  for(const link of linked){
    const stock=stockById(link.stock_item_id);
    const li=document.createElement('li');
    const span=document.createElement('span');
    const qty=stock?Number(stock.quantity||0):null;
    const low=stock&&qty>0&&qty<=Number(stock.minimum_stock||0);
    const per=link.qty_per_serving==null?'':` · ${Number(link.qty_per_serving).toLocaleString('id-ID')} / porsi`;
    span.textContent=stock?`${stock.name} · ${stock.division} · ${qty.toLocaleString('id-ID')} ${stock.unit}${per}${qty<=0?' · habis':low?' · menipis':''}`:'Bahan tidak ditemukan';
    const del=document.createElement('button');del.type='button';del.className='secondary';del.textContent='Hapus';
    del.onclick=async()=>{del.disabled=true;const {error}=await db.from('menu_stock_links').delete().eq('id',link.id);if(error){note('Gagal melepas bahan: '+error.message,true);del.disabled=false;return}quiet=true;await load()};
    li.append(span,del);ul.append(li);
  }
  if(ul.childElementCount)box.append(ul);
  const add=document.createElement('div');add.className='link-add';
  const select=document.createElement('select');select.setAttribute('aria-label',`Pilih bahan untuk ${item.name}`);
  const empty=document.createElement('option');empty.value='';empty.textContent='Pilih bahan stok';select.append(empty);
  for(const division of ['Bar','Kitchen']){
    const group=document.createElement('optgroup');group.label=division;
    for(const stock of stockItems.filter(s=>String(s.division).toLowerCase()===division.toLowerCase())){
      const opt=document.createElement('option');opt.value=stock.id;opt.textContent=stock.name;group.append(opt);
    }
    if(group.childElementCount)select.append(group);
  }
  const plus=document.createElement('button');plus.type='button';plus.textContent='Tambah';
  plus.onclick=async()=>{
    if(!select.value){note('Pilih bahan stok terlebih dahulu.',true);return}
    plus.disabled=true;
    const {error}=await db.from('menu_stock_links').insert({menu_id:item.id,stock_item_id:select.value});
    plus.disabled=false;
    if(error){note(/duplicate|unique/i.test(error.message)?'Bahan ini sudah terhubung.':'Gagal menghubungkan bahan: '+error.message,true);return}
    quiet=true;await load();
  };
  add.append(select,plus);box.append(add);
  const mode=document.createElement('div');mode.className='actions';
  const follow=document.createElement('button');follow.type='button';follow.textContent='Ikuti stok';follow.disabled=!linked.length||item.availability_mode==='auto';
  const lock=document.createElement('button');lock.type='button';lock.className='secondary';lock.textContent='Kunci manual';lock.disabled=item.availability_mode!=='auto';
  follow.onclick=()=>setMode(item,'auto',follow);
  lock.onclick=()=>setMode(item,'manual',lock);
  mode.append(follow,lock);box.append(mode);
  return box;
}
async function setMode(item,mode,button){
  if(mode==='auto'&&!itemLinks(item.id).length){note('Tambahkan minimal satu bahan sebelum mengikuti stok.',true);return}
  button.disabled=true;
  const {error}=await db.from('menu_availability').update({availability_mode:mode}).eq('id',item.id);
  if(error){note(missingSchema(error)?'Sinkron belum aktif. Jalankan sql/menu-stock-sync.sql di Supabase.':'Gagal mengubah mode: '+error.message,true);button.disabled=false;return}
  quiet=true;await load();
}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{currentType=tab.dataset.type;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));$('search').value='';$('filter').value='all';render()}));
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').classList.add('hidden');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;$('loginError').classList.remove('hidden');return}$('password').value='';await load()};
$('logout').onclick=async()=>{await db.auth.signOut();await load()};
async function load(){
  if(!quiet)note('Memuat menu…');
  quiet=false;
  const auth=await db.auth.getUser();
  user=auth.error?null:auth.data?.user||null;
  const extended=await db.from('menu_availability').select('id,category,name,price,is_ready,stock_qty,sort_order,availability_mode,sync_level').order('sort_order',{ascending:true});
  syncReady=!extended.error;
  let rows=extended.data;
  if(extended.error&&missingSchema(extended.error)){
    const basic=await db.from('menu_availability').select('id,category,name,price,is_ready,stock_qty,sort_order').order('sort_order',{ascending:true});
    if(basic.error){note('Data belum dapat dibuka. '+basic.error.message,true);return}
    rows=(basic.data||[]).map(x=>({...x,availability_mode:'manual',sync_level:null}));
    syncReady=false;
  }else if(extended.error){note('Data belum dapat dibuka. '+extended.error.message,true);return}
  data=rows||[];
  links=[];stockItems=[];canWrite=false;
  let linkWarning='';
  if(syncReady&&user){
    const [linkRes,stockRes]=await Promise.all([
      db.from('menu_stock_links').select('id,menu_id,stock_item_id,qty_per_serving'),
      db.from('lokalin_stock_items').select('id,name,division,unit,quantity,minimum_stock').order('name')
    ]);
    if(linkRes.error){if(missingSchema(linkRes.error))syncReady=false;else linkWarning='Hubungan bahan belum terbaca. '+linkRes.error.message}
    else links=linkRes.data||[];
    if(!stockRes.error)stockItems=stockRes.data||[];
  }
  $('logout').classList.toggle('hidden',!user);
  $('login').classList.toggle('hidden',!!user);
  if(!user){
    $('who').textContent='';
    note('Menu dapat dilihat tanpa login. Masuk sebagai owner atau staf untuk mengubah status.');
  }else{
    const [appRole,stockRole]=await Promise.all([
      db.from('app_roles').select('role').eq('user_id',user.id).limit(1),
      db.from('lokalin_stock_roles').select('role').eq('user_id',user.id).maybeSingle()
    ]);
    const roles=[appRole.data?.[0]?.role,stockRole.data?.role].filter(r=>r==='owner'||r==='staff');
    canWrite=roles.length>0;
    $('who').textContent=`${user.email} · ${canWrite?roles[0].toUpperCase():'hanya lihat'}`;
    if(!canWrite)note('Anda masuk, tetapi akun ini belum punya peran owner atau staf untuk mengubah menu.',true);
    else if(linkWarning)note(linkWarning,true);
    else if(!syncReady)note('Status masih diubah manual. Untuk sinkron dengan gudang, jalankan sql/menu-stock-sync.sql di Supabase, lalu hubungkan bahan pada tiap menu.');
    else hideNote();
  }
  $('controls').classList.remove('hidden');
  render();
}
let timer=null;
db.channel('menu-availability-dashboard').on('postgres_changes',{event:'*',schema:'public',table:'menu_availability'},()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!document.querySelector('input:focus, select:focus'))load()},500)}).subscribe();
await load();
</script></body></html>
