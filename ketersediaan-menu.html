<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bd2922"><title>Ketersediaan Menu | Lokalin</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#4b2720}*{box-sizing:border-box}body{margin:0;background:#f8f0e5}header{background:#b82521;color:#fff7e9;padding:24px 18px}header .wrap,main{max-width:850px;margin:auto}header a{color:inherit;text-decoration:none}h1{margin:15px 0 5px;font-size:29px}p{margin:6px 0 12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 8px}.tab{border:1px solid #d6bdb0;border-radius:14px;padding:14px 8px;background:#fff;color:#6d4037;font-weight:800;font-size:16px;cursor:pointer}.tab.active{background:#b82521;color:white;border-color:#b82521}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,select{padding:13px;border:1px solid #d6bdb0;border-radius:12px;background:white;font:inherit;min-width:0}input{flex:1;min-width:160px}main{padding:0 16px 35px}.summary{font-size:14px;color:#6e5149}.group{margin:20px 0;background:#fff;border:1px solid #eddcd0;border-radius:18px;overflow:hidden}.group h2{font-size:17px;margin:0;padding:15px;background:#fff4e9}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 15px;border-top:1px solid #f1e6dd}.item strong{display:block;font-size:15px}.item small{color:#80655a}.qty{width:92px;min-width:70px;text-align:center}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.switch{border:0;border-radius:999px;padding:10px 13px;min-width:100px;font-weight:800;cursor:pointer;background:#dcefe1;color:#156538}.switch.sold{background:#fce0db;color:#9b2b22}.switch:disabled{opacity:.55;cursor:wait}.notice{padding:14px;border-radius:12px;background:#fff3ce;margin:15px 0;color:#765414}.error{background:#ffe1dc;color:#8e1e1e}.hidden{display:none!important}</style></head><body><header><div class="wrap"><a href="./index.html">← Kembali ke Dashboard</a><h1>🍽️ Ketersediaan Menu</h1><p>Makanan: jumlah porsi & status · Minuman: Ready / Non Ready</p></div></header><main><div id="notice" class="notice">Memeriksa login dan memuat menu…</div><div id="controls" class="hidden"><div class="tabs"><button class="tab active" type="button" data-type="food">🍽️ Makanan</button><button class="tab" type="button" data-type="drink">☕ Minuman</button></div><div class="toolbar"><input id="search" type="search" placeholder="Cari nama menu…" aria-label="Cari menu"><select id="filter" aria-label="Filter status"><option value="all">Semua status</option><option value="ready">Ready</option><option value="sold">Sold Out</option></select></div><p class="summary" id="summary"></p><div id="list"></div></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://kwhtqqrzeifmntdtugvg.supabase.co','sb_publishable_JGQ9jpXgEb3IMl0YjY3Txg_cQKy02Fs');
const $=id=>document.getElementById(id);let data=[];let currentType='food';const drinkCategories=new Set(['Coffee Classic','Coffee & Mocktail','Tea','Non-Coffee']);const isDrink=x=>drinkCategories.has(x.category);
function note(message,isError=false){$('notice').textContent=message;$('notice').classList.toggle('error',isError);$('notice').classList.remove('hidden')}
function render(){const q=$('search').value.toLocaleLowerCase('id').trim(),f=$('filter').value;const scoped=data.filter(x=>currentType==='drink'?isDrink(x):!isDrink(x));const filtered=scoped.filter(x=>x.name.toLocaleLowerCase('id').includes(q)&&(f==='all'||(f==='ready'===x.is_ready)));$('summary').textContent=`${scoped.filter(x=>x.is_ready).length} Ready · ${scoped.filter(x=>!x.is_ready).length} ${currentType==='drink'?'Non Ready':'Sold Out'} · ${scoped.length} menu${currentType==='food'?' · '+scoped.reduce((a,x)=>a+(x.stock_qty||0),0)+' total porsi makanan':''}`;const root=$('list');root.replaceChildren();const groups=[...new Set(filtered.map(x=>x.category))];for(const category of groups){const section=document.createElement('section');section.className='group';const title=document.createElement('h2');title.textContent=category;section.append(title);for(const item of filtered.filter(x=>x.category===category)){const row=document.createElement('div');row.className='item';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=item.name;const price=document.createElement('small');price.textContent=new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(item.price);info.append(name,price);const actions=document.createElement('div');actions.className='actions';const qty=document.createElement('input');qty.className='qty';qty.type='number';qty.min='0';qty.step='1';qty.value=String(item.stock_qty??0);qty.setAttribute('aria-label',`Jumlah stok ${item.name}`);qty.onchange=async()=>{const n=Number(qty.value);if(!Number.isSafeInteger(n)||n<0){note('Jumlah stok harus bilangan bulat 0 atau lebih.',true);qty.value=String(item.stock_qty??0);return}qty.disabled=true;const {error}=await db.from('menu_availability').update({stock_qty:n,is_ready:n>0}).eq('id',item.id);if(error){note('Gagal menyimpan stok: '+error.message,true);qty.value=String(item.stock_qty??0)}else{item.stock_qty=n;item.is_ready=n>0;$('notice').classList.add('hidden');render()}qty.disabled=false};const btn=document.createElement('button');btn.className='switch'+(item.is_ready?'':' sold');btn.textContent=item.is_ready?'✓ Ready':(isDrink(item)?'✕ Non Ready':'✕ Sold Out');btn.setAttribute('aria-label',`Ubah status ${item.name}`);btn.onclick=async()=>{btn.disabled=true;const next=!item.is_ready;if(!isDrink(item) && next && Number(item.stock_qty)===0){note('Isi jumlah stok lebih dari 0 untuk mengaktifkan Ready.',true);btn.disabled=false;return}const {error}=await db.from('menu_availability').update({is_ready:next}).eq('id',item.id);if(error){note('Gagal menyimpan: '+error.message,true);btn.disabled=false;return}item.is_ready=next;$('notice').classList.add('hidden');render()};if(!isDrink(item))actions.append(qty);actions.append(btn);row.append(info,actions);section.append(row)}root.append(section)}if(!filtered.length){const p=document.createElement('p');p.textContent='Tidak ada menu yang cocok.';root.append(p)}}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{currentType=tab.dataset.type;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));$('search').value='';$('filter').value='all';render()}));$('search').addEventListener('input',render);$('filter').addEventListener('change',render);
async function load(){const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){note('Silakan login melalui Dashboard Lokalin Management terlebih dahulu.',true);return}const {data:rows,error}=await db.from('menu_availability').select('id,category,name,price,is_ready,stock_qty').order('sort_order',{ascending:true});if(error){note('Data belum dapat dibuka. Jalankan file setup-menu.sql di Supabase SQL Editor terlebih dahulu. Detail: '+error.message,true);return}data=rows||[];$('controls').classList.remove('hidden');$('notice').classList.add('hidden');render()}
await load();db.channel('menu-availability-dashboard').on('postgres_changes',{event:'*',schema:'public',table:'menu_availability'},()=>{load()}).subscribe();
</script></body></html>
