<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ac241e"><title>Panggil Server | Lokalin Cafe</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(145deg,#9f201d,#d93b2c);font-family:system-ui,-apple-system,sans-serif;color:#52221c;padding:20px}.card{background:#fff9ed;border-radius:26px;padding:35px 25px;max-width:420px;width:100%;text-align:center;box-shadow:0 16px 40px #5b120e55}.logo{font-size:40px;font-weight:900;font-style:italic;color:#a72220}h1{font-size:24px;margin:22px 0 6px}p{color:#775951;line-height:1.5}button{width:100%;border:0;border-radius:18px;background:#a72220;color:white;padding:22px 12px;font-weight:800;font-size:21px;margin-top:22px;cursor:pointer}button:disabled{opacity:.6}#msg{min-height:50px;margin-top:20px;font-weight:650}small{display:block;margin-top:22px;color:#9c837a}</style></head><body><main class="card"><div class="logo">lokalin.</div><h1 id="room">Meeting Room</h1><p>Butuh bantuan? Tekan tombol di bawah untuk memanggil server.</p><button id="call" disabled>🔔 PANGGIL SERVER</button><div id="msg" role="status" aria-live="polite">Memuat…</div><small>LOKALIN CAFE · ROOM SERVICE</small></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://kwhtqqrzeifmntdtugvg.supabase.co','sb_publishable_JGQ9jpXgEb3IMl0YjY3Txg_cQKy02Fs',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const params=new URLSearchParams(location.search),room=params.get('room');const names={'lantai-1':'Meeting Room Lantai 1','lantai-2':'Meeting Room Lantai 2'};const btn=document.querySelector('#call'),msg=document.querySelector('#msg');
if(!names[room]){document.querySelector('#room').textContent='QR tidak valid';msg.textContent='Silakan scan QR Code resmi di meeting room.'}else{document.querySelector('#room').textContent=names[room];btn.disabled=false;msg.textContent='Siap memanggil server.'}
btn.onclick=async()=>{btn.disabled=true;msg.textContent='Mengirim panggilan…';try{const {data,error}=await db.rpc('request_room_call',{p_room:room});if(error)throw error;msg.textContent=data?.message||'Panggilan berhasil dikirim.';if(data?.status==='terkirim'||data?.status==='menunggu'){btn.textContent='✓ PANGGILAN TERKIRIM';setTimeout(()=>{btn.textContent='🔔 PANGGIL SERVER';btn.disabled=false},30000)}else btn.disabled=false}catch(e){msg.textContent='Belum bisa mengirim panggilan. Hubungi kasir atau coba lagi.';btn.disabled=false;console.error(e)}};
</script></body></html>
