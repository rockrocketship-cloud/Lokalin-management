<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a72220"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><title>Panggil Karyawan | Lokalin Management</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#4d2823;font-family:system-ui,-apple-system,sans-serif}
header{background:#ac2821;color:#fff8ef;padding:20px}header a{color:#fff8ef}
main{max-width:900px;margin:auto;padding:20px}
h1{margin:0 0 6px}p{line-height:1.5}.muted{color:#806e65}.error{color:#a72220}.hidden{display:none}
.pesan{margin:18px 0;padding:16px;background:#fff;border:2px solid #e7d8ca;border-radius:16px}
label{display:block;font-size:13px;font-weight:700;color:#6b4a43;margin-bottom:6px}
select{width:100%;max-width:320px;font:inherit;font-size:15px;padding:11px;border:1px solid #d9c6b8;border-radius:10px;background:#fff8ef;color:#4d2823}
.staf{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:8px}
.kartu{border:2px solid #e7d8ca;border-radius:18px;background:#fff;padding:18px}
.kartu b{font-size:18px}.kartu .jab{color:#806e65;font-size:14px;margin:4px 0 14px}
button{width:100%;border:0;border-radius:12px;background:#a72220;color:#fff;padding:14px;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.55}
.riwayat{margin-top:28px}li{padding:8px 0;border-bottom:1px solid #e7d8ca}
#loginNotice{padding:18px;background:#fff;border-radius:14px}
.catatan{padding:14px;background:#fff3e2;border:2px solid #f0d8b8;border-radius:14px;font-size:14px}.catatan.siap{background:#eaf6e8;border-color:#bcdcb5}.catatan.mati{background:#fdecea;border-color:#f3c0b9}.kartu button.gagal{background:#8a6f66}
</style></head><body>
<header><a href="./index.html">← Dashboard Lokalin</a><h1>📣 Panggil Karyawan</h1><div>Diumumkan lewat speaker iPad kasir</div></header>
<main>
<div id="loginNotice">Memeriksa login Dashboard…</div>
<section id="app" class="hidden">
<p class="catatan" id="statusKasir">Memeriksa iPad kasir…</p>
<div class="pesan">
  <label for="pesan">Pesan</label>
  <select id="pesan">
    <option value="ke kasir">ke kasir</option>
    <option value="ke dapur">ke dapur</option>
    <option value="ke bar">ke bar</option>
    <option value="ke meeting room lantai 1">ke meeting room lantai 1</option>
    <option value="ke meeting room lantai 2">ke meeting room lantai 2</option>
    <option value="ada tamu menunggu">ada tamu menunggu</option>
  </select>
</div>
<div id="staf" class="staf"></div>
<section class="riwayat"><h2>Panggilan terakhir</h2><ul id="riwayat"></ul></section>
<p id="err" class="error" role="alert"></p>
</section>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://kwhtqqrzeifmntdtugvg.supabase.co','sb_publishable_JGQ9jpXgEb3IMl0YjY3Txg_cQKy02Fs');
const $=s=>document.querySelector(s);
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const {data:{session}}=await db.auth.getSession();
if(!session){$('#loginNotice').innerHTML='Silakan <a href="./index.html">login melalui Dashboard</a> terlebih dahulu, lalu kembali ke halaman ini.'}
else{$('#loginNotice').classList.add('hidden');$('#app').classList.remove('hidden');await muatStaf();await muatRiwayat();pantauKasir();
  db.channel('lokalin-staff-calls').on('postgres_changes',{event:'*',schema:'public',table:'staff_calls'},()=>muatRiwayat()).subscribe()}

// Kehadiran iPad kasir: kalau tidak ada yang membuka Room Service,
// panggilan tidak akan terdengar oleh siapa pun.
let kasirSiap=false;
function pantauKasir(){
  const el=$('#statusKasir');
  const ch=db.channel('lokalin-kasir');
  const perbarui=()=>{
    let ada=0,bersuara=0;
    try{const st=ch.presenceState();
      for(const k of Object.keys(st))for(const m of st[k]){ada++;if(m.suara)bersuara++}}catch(e){}
    kasirSiap=bersuara>0;
    if(bersuara>0){el.className='catatan siap';el.innerHTML='✅ iPad kasir aktif dan suaranya siap. Panggilan akan terdengar di sana.'}
    else if(ada>0){el.className='catatan';el.innerHTML='⚠️ iPad kasir terbuka tapi <b>suaranya belum diaktifkan</b>. Tekan tombol Aktifkan Suara di halaman Room Service pada iPad itu.'}
    else{el.className='catatan mati';el.innerHTML='🔇 Tidak ada iPad yang membuka halaman Room Service. Panggilan akan tersimpan, tapi <b>tidak ada yang membunyikannya</b>.'}
  };
  ch.on('presence',{event:'sync'},perbarui)
    .on('presence',{event:'join'},perbarui)
    .on('presence',{event:'leave'},perbarui)
    .subscribe(st=>{if(st==='SUBSCRIBED')setTimeout(perbarui,600)});
  setTimeout(perbarui,2500);
}

// Tunggu iPad menandai panggilan selesai, supaya tombolnya memberi kepastian
// bukan sekadar "terkirim".
async function tungguDiumumkan(id, batasMs=12000){
  const mulai=Date.now();
  while(Date.now()-mulai<batasMs){
    await new Promise(r=>setTimeout(r,1200));
    const {data}=await db.from('staff_calls').select('status').eq('id',id).maybeSingle();
    if(data&&data.status==='selesai')return true;
  }
  return false;
}

async function muatStaf(){
  const {data,error}=await db.from('employees').select('id,name,position,active');
  if(error){$('#err').textContent='Tidak dapat membaca daftar karyawan: '+error.message;return}
  const aktif=(data||[]).filter(e=>e.active!==false&&e.name).sort((a,b)=>a.name.localeCompare(b.name));
  $('#staf').replaceChildren();
  for(const e of aktif){
    const k=document.createElement('article');k.className='kartu';
    k.innerHTML=`<b>${escapeHtml(e.name)}</b><div class="jab">${escapeHtml(e.position||'—')}</div>`;
    const b=document.createElement('button');b.textContent='📣 Panggil';
    b.onclick=async()=>{
      b.disabled=true;const semula=b.textContent;b.textContent='Mengirim…';
      const {data:baris,error}=await db.from('staff_calls')
        .insert({nama:e.name,jabatan:e.position||null,pesan:$('#pesan').value})
        .select('id').single();
      if(error){$('#err').textContent='Gagal memanggil: '+error.message;b.textContent=semula;b.disabled=false;return}
      $('#err').textContent='';b.textContent='⏳ Menunggu iPad…';
      await muatRiwayat();
      const sampai=await tungguDiumumkan(baris.id);
      b.classList.toggle('gagal',!sampai);
      b.textContent=sampai?'✓ Diumumkan di kasir':'⚠️ Belum diumumkan';
      if(!sampai)$('#err').textContent='iPad kasir belum membunyikannya. Periksa halaman Room Service di iPad — mungkin tertutup atau suaranya belum diaktifkan.';
      setTimeout(()=>{b.textContent=semula;b.classList.remove('gagal');b.disabled=false},6000);
      await muatRiwayat();
    };
    k.append(b);$('#staf').append(k);
  }
}

async function muatRiwayat(){
  const {data,error}=await db.from('staff_calls').select('nama,pesan,status,created_at').order('created_at',{ascending:false}).limit(12);
  if(error)return;
  $('#riwayat').replaceChildren();
  for(const c of data||[]){
    const li=document.createElement('li');
    li.textContent=`${c.nama} · ${c.pesan} · ${c.status==='menunggu'?'belum diumumkan':'sudah diumumkan'} · ${new Date(c.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`;
    $('#riwayat').append(li);
  }
}
</script></body></html>
