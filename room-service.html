<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a72220"><title>Room Service | Lokalin Management</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#4d2823;font-family:system-ui,-apple-system,sans-serif}header{background:#ac2821;color:#fff8ef;padding:20px}header a{color:#fff8ef}main{max-width:900px;margin:auto;padding:20px}h1{margin:0 0 6px}p{line-height:1.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}button,.link{border:0;border-radius:12px;background:#a72220;color:#fff;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer}.secondary{background:#f1e1d5;color:#622e27}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.room{border:2px solid #e7d8ca;border-radius:18px;background:white;padding:20px}.room.active{border-color:#c72b21;background:#fff0e9}.status{font-size:14px;font-weight:700;margin:12px 0}.muted{color:#806e65}.error{color:#a72220}.hidden{display:none}.history{margin-top:28px}li{padding:8px 0;border-bottom:1px solid #e7d8ca}#loginNotice{padding:18px;background:#fff;border-radius:14px}</style></head><body><header><a href="./index.html">← Dashboard Lokalin</a><h1>🔔 Room Service</h1><div>Notifikasi Meeting Room · iPad Kasir</div></header><main><div id="loginNotice">Memeriksa login Dashboard…</div><section id="app" class="hidden"><div class="toolbar"><button id="sound">🔊 Aktifkan Suara Bel</button><button class="secondary" id="refresh">↻ Perbarui</button><span id="soundState" class="muted">Suara belum diaktifkan</span></div><p class="muted">Biarkan halaman ini tetap terbuka di iPad kasir. Panggilan diperbarui otomatis; notifikasi suara memerlukan satu kali ketukan tombol.</p><div id="rooms" class="rooms"></div><section class="history"><h2>Riwayat terbaru</h2><ul id="history"></ul></section><p id="err" class="error" role="alert"></p></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://kwhtqqrzeifmntdtugvg.supabase.co','sb_publishable_JGQ9jpXgEb3IMl0YjY3Txg_cQKy02Fs');const $=s=>document.querySelector(s);let lastIds=new Set(),loaded=false,soundEnabled=false,audioCtx=null,busy=false;const roomNames={'lantai-1':'Meeting Room Lantai 1','lantai-2':'Meeting Room Lantai 2'};
const {data:{session}}=await db.auth.getSession();if(!session){$('#loginNotice').innerHTML='Silakan <a href="./index.html">login melalui Dashboard</a> terlebih dahulu, lalu kembali ke halaman ini.'}else{$('#loginNotice').classList.add('hidden');$('#app').classList.remove('hidden');await refresh();db.channel('lokalin-room-calls').on('postgres_changes',{event:'*',schema:'public',table:'room_calls'},()=>refresh()).subscribe();setInterval(refresh,5000)}
function bell(){if(!soundEnabled||!audioCtx)return;try{const now=audioCtx.currentTime;[0,.23,.46].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.22,now+t+.025);g.gain.exponentialRampToValueAtTime(.0001,now+t+.18);o.connect(g).connect(audioCtx.destination);o.start(now+t);o.stop(now+t+.2)})}catch(e){console.error(e)}}
$('#sound').onclick=async()=>{try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();soundEnabled=true;$('#soundState').textContent='Suara bel aktif';$('#sound').textContent='🔔 Tes Suara Bel';bell()}catch(e){$('#soundState').textContent='Audio tidak tersedia di browser ini'}};
$('#refresh').onclick=refresh;
async function refresh(){if(busy)return;busy=true;try{const {data,error}=await db.from('room_calls').select('id,room,status,created_at,served_at').order('created_at',{ascending:false}).limit(80);if(error)throw error;const active=data.filter(x=>x.status==='menunggu');const ids=new Set(active.map(x=>x.id));if(loaded&&active.some(x=>!lastIds.has(x.id)))bell();lastIds=ids;loaded=true;$('#rooms').replaceChildren();for(const [key,name] of Object.entries(roomNames)){const call=active.find(x=>x.room===key),card=document.createElement('article');card.className='room'+(call?' active':'');const title=document.createElement('h2');title.textContent=name;card.append(title);const status=document.createElement('div');status.className='status';status.textContent=call?'🔴 MEMANGGIL SERVER':'🟢 Tidak ada panggilan';card.append(status);if(call){const time=document.createElement('p');time.textContent='Sejak '+new Date(call.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});card.append(time);const btn=document.createElement('button');btn.textContent='✓ Sudah Dilayani';btn.onclick=async()=>{btn.disabled=true;const {error}=await db.from('room_calls').update({status:'dilayani',served_at:new Date().toISOString(),served_by:session.user.id}).eq('id',call.id).eq('status','menunggu');if(error){$('#err').textContent='Gagal menandai dilayani: '+error.message;btn.disabled=false}else await refresh()};card.append(btn)}$('#rooms').append(card)}$('#history').replaceChildren();for(const c of data.slice(0,15)){const li=document.createElement('li');li.textContent=`${roomNames[c.room]||c.room} · ${c.status==='menunggu'?'Menunggu':'Sudah dilayani'} · ${new Date(c.created_at).toLocaleString('id-ID')}`;$('#history').append(li)}$('#err').textContent=''}catch(e){$('#err').textContent='Tidak dapat membaca panggilan. Pastikan SQL sudah dijalankan dan login aktif. '+e.message}finally{busy=false}}
</script></body></html>
