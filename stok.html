if(location.protocol==='file:')document.getElementById('preview-warning').style.display='block';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x||0).toLocaleString('id-ID',{maximumFractionDigits:3});let db,role,items=[],history=[],tab='stock',division='Bar',busy=false,stockQuery='',stockFilter='all';const message=x=>$('message').textContent=x||'';let config;try{config=JSON.parse(localStorage.getItem('lokalin-cloud')||'null')}catch{}if(config){$('url').value=config.url;$('key').value=config.key}
async function connect(){try{let url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key)throw Error('URL atau key tidak valid');if(!window.supabase)throw Error('Library Supabase tidak termuat');db=supabase.createClient(url,key);localStorage.setItem('lokalin-cloud',JSON.stringify({url,key}));$('setup').classList.add('hide');db.auth.onAuthStateChange(()=>setTimeout(check,0));await check()}catch(e){message(e.message)}}
async function check(){if(!db)return;const {data:{user},error}=await db.auth.getUser();if(error||!user){role=null;$('payrollNav').classList.add('hide');$('login').classList.remove('hide');$('app').classList.add('hide');$('logout').classList.add('hide');$('who').textContent='Login diperlukan';return}const r=await db.from('lokalin_stock_roles').select('role').eq('user_id',user.id).maybeSingle();if(r.error){$('payrollNav').classList.add('hide');return message(r.error.message)}role=r.data?.role;$('payrollNav').classList.toggle('hide',role!=='owner');$('login').classList.add('hide');$('logout').classList.remove('hide');$('who').textContent=user.email+' · '+(role||'belum ada role');$('app').classList.toggle('hide',!role);if(!role)return message('Akun belum diberikan role stok');message('');await refresh()}
$('connect').onclick=connect;$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)message(r.error.message);else check()};$('logout').onclick=async()=>{await db.auth.signOut();check()};if(config)connect();
async function refresh(){if(!role||busy)return;let [a,b]=await Promise.all([db.from('lokalin_stock_items').select('*').order('name'),db.from('lokalin_stock_transactions').select('*').order('created_at',{ascending:false}).limit(250)]);if(a.error||b.error)return message((a.error||b.error).message);items=a.data;history=b.data;if(stockFormInProgress()){renderSummary();renderStockList()}else render()}
function filteredItems(){return items.filter(i=>String(i.division).toLowerCase()===division.toLowerCase())}

function render(){renderSummary();document.querySelectorAll('[data-division]').forEach(b=>{b.classList.toggle('selected',b.dataset.division===division);b.setAttribute('aria-pressed',String(b.dataset.division===division))});document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-pressed',String(b.dataset.tab===tab))});if(tab==='stock')stock();if(tab==='move')move();if(tab==='history')logs();if(tab==='report')report()}
function stock(){

}

function renderStockList(){
 const list=$('stockList');if(!list)return;
 const selected=filteredItems();
 const query=stockQuery.trim().toLocaleLowerCase('id-ID');
 const visible=selected.filter(i=>String(i.name).toLocaleLowerCase('id-ID').includes(query)&&(stockFilter!=='low'||+i.quantity<=+i.minimum_stock));
 $('stockCount').textContent=visible.length+' dari '+selected.length+' barang';
 list.innerHTML=visible.map(i=>{
  const low=+i.quantity<=+i.minimum_stock;

  return '<article class="stock-item '+(low?'low':'')+'"><div><h3>'+esc(i.name)+'</h3><p class="stock-meta">Minimum '+fmt(i.minimum_stock)+' '+esc(i.unit)+'</p></div><div class="stock-quantity"><strong>'+fmt(i.quantity)+'</strong><small>'+esc(i.unit)+'</small></div><div class="stock-bottom"><span class="stock-state">'+status+'</span>'+(['owner','staff'].includes(role)?'<button type="button" data-edit="'+esc(i.id)+'" aria-label="Edit '+esc(i.name)+'">Edit</button>':'')+'</div>'+(role==='owner'?'<div class="stock-value">Harga/satuan Rp '+Number(i.purchase_price||0).toLocaleString('id-ID',{maximumFractionDigits:4})+' · Nilai Rp '+Number(Number(i.quantity||0)*Number(i.purchase_price||0)).toLocaleString('id-ID',{maximumFractionDigits:2})+'</div>':'')+'</article>';
 }).join('')||'<div class="stock-empty">'+(selected.length?'Tidak ada barang yang cocok.':'Belum ada barang di divisi ini.')+'</div>';

function attachPackCalculator(form){
 const price=form.elements.price, pack=form.elements.packPrice, amount=form.elements.packAmount, mode=form.elements.packMode, output=form.querySelector('[data-pack-result]');
 if(!pack||!amount||!mode||!output)return;
 const calculate=()=>{
  const p=Number(pack.value), a=Number(amount.value), factor=mode.value==='ml-to-g'?1.03:1;
  if(!pack.value||!amount.value||!Number.isFinite(p)||!Number.isFinite(a)||p<0||a<=0){output.textContent='Isi harga dan ukuran kemasan untuk menghitung harga per satuan.';return}
  const units=a*factor, result=p/units;
  price.value=Number(result.toFixed(4));
  output.textContent='1 kemasan ≈ '+units.toLocaleString('id-ID',{maximumFractionDigits:2})+' '+(mode.value==='ml-to-g'?'g':form.elements.unit.value||'satuan')+' · HPP Rp'+result.toLocaleString('id-ID',{maximumFractionDigits:2})+' / '+(mode.value==='ml-to-g'?'g':form.elements.unit.value||'satuan');

}

function openStockEditor(id){
 const item=items.find(i=>String(i.id)===String(id));if(!item)return message('Barang tidak ditemukan');
 const box=$('editor');box.classList.remove('hide');box.innerHTML='<div style="border:1px solid #eadfd8;padding:16px;border-radius:16px;margin-top:16px;background:#fff7ed"><h3>Edit Barang: '+esc(item.name)+'</h3><form id="editStockForm"><div class="grid"><label>Nama barang<input name="name" required></label><label>Divisi<select name="division"><option>Bar</option><option>Kitchen</option></select></label><label>Satuan<input name="unit" required></label><label>Stok minimum<input name="minimum" type="number" min="0" step="any" required></label><label>Harga beli per satuan stok (Rp)<input name="price" type="number" min="0" step="any" required></label><label>Nama pengedit<input name="editor" required maxlength="100" placeholder="Nama karyawan"></label>'+packFields()+'</div><p style="font-size:13px">Jumlah stok diubah melalui menu Barang Masuk / Keluar agar tercatat sebagai transaksi.</p><button type="submit">Simpan Perubahan</button><button type="button" id="cancelStockEdit" style="background:#e9d6c4;color:#42241e">Batal</button></form></div>';
 const form=$('editStockForm');form.elements.name.value=item.name;form.elements.division.value=item.division;form.elements.unit.value=item.unit;form.elements.minimum.value=item.minimum_stock??0;form.elements.price.value=item.purchase_price??0;attachPackCalculator(form);
 // Pulihkan isian jika halaman ter-render ulang atau browser me-reload.
 const draftKey='lokalin-stock-edit-'+String(item.id);
 try{const draft=JSON.parse(sessionStorage.getItem(draftKey)||'null');if(draft&&Date.now()-draft.savedAt<86400000){for(const [key,value] of Object.entries(draft.fields||{})){const el=form.elements.namedItem(key);if(el&&'value' in el)el.value=value}}}catch(_){}
